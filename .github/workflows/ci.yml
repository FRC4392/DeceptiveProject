name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The "Protect main" ruleset requires a status check named `check`, so keep
  # this job's name as it is.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint # tsc + eslint
      - run: npm run format:check # prettier --check .
      - run: npm test # vitest run (includes the src/e2e smoke tests)
